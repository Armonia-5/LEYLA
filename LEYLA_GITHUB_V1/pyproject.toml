[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leyla"
version = "1.0.0"
description = "LEYLA: data-Labelling Engine, energy-Yielding, and active-Learning Automation"
readme = "README.md"
authors = [
    { name = "Alessandro Morittu" }
]
requires-python = ">=3.11"
dependencies = [
    "ase>=3.29.0",
    "cp2k-input-tools>=0.9.1",
    "Cp2kData>=0.7.3",
    "dpdata>=1.0.2",
    "dscribe>=2.1.2",
    "e3nn>=0.4.4",
    "h5py>=3.16.0",
    "matscipy>=1.2.0",
    "numba>=0.67.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "PyYAML>=6.0.3",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "torchmetrics>=1.6.0",
    "tqdm>=4.66.0"
]

[project.scripts]
leyla = "leyla_master:main"

[tool.setuptools]
py-modules = [
    "leyla_master",
    "lammps_to_xyz",
    "mace_calculator",
    "soap_filter",
    "xyz_to_ase",
    "conversion",
    "training"
]
